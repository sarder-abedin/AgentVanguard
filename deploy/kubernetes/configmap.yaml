# Default agentvanguard config for the sidecar deployment. Customize this
# (or replace it entirely) for your environment, then re-apply:
#
#   kubectl apply -f configmap.yaml
#   kubectl rollout restart deployment/agentvanguard
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentvanguard-config
  labels:
    app: agentvanguard
data:
  agentvanguard.yaml: |
    firewall:
      fail_closed: true
      default_workflow_mode: restrictive
      log_level: INFO
      approval_provider: auto_deny

    audit:
      backend: jsonl
      path: /app/logs/agentvanguard_audit.jsonl
      redact_secrets: true

    runtime_limits:
      max_steps: 12
      max_tool_calls: 8
      max_runtime_seconds: 60
      max_cost_usd: 5.00
      max_repeated_calls: 3

    prompt_injection:
      enabled: true
      deny_threshold: 0.85
      review_threshold: 0.65

    dlp:
      enabled: true
      redact_emails: false
      redact_secrets: true
      redact_credit_cards: true

    provenance_mapping:
      user: user
      system: system
      assistant: assistant
      tool: tool_output

    tool_guard:
      workspace_root: /app
      egress_allowlist: []

    tools:
      send_email:
        description: Send an email to an external recipient.
        action_type: send_external
        side_effect: external_communication
        risk_tier: high
        reversible: false
        requires_approval: true
        allowed_callers: [support_agent, invoice_agent]

      query_customer_db:
        description: Run a read-only query against the customer database.
        action_type: read
        side_effect: internal_read
        risk_tier: medium
        reversible: true
        requires_approval: false
        allowed_callers: [support_agent]
        extra:
          max_rows: 100

    workflows:
      finance_invoice_review:
        risk_tier: high
        allowed_agents: [invoice_agent]
        allowed_tools: [query_customer_db]
        egress_allowlist: [company.com, trusted-vendor.com]

    rules: []
