# Config for the LangGraph + Streamlit demo (examples/langgraph_gui_demo/).
#
# Extends examples/agentvanguard.yaml with one extra tool, check_status_page,
# used to demonstrate the SSRF guard against an LLM-chosen URL.

firewall:
  fail_closed: true
  default_workflow_mode: restrictive   # restrictive | permissive
  log_level: INFO
  approval_provider: auto_deny         # auto_deny | cli_prompt

audit:
  backend: jsonl
  path: ./logs/agentvanguard_audit.jsonl
  redact_secrets: true

runtime_limits:
  max_steps: 12
  max_tool_calls: 8
  max_runtime_seconds: 60
  max_cost_usd: 5.00
  max_repeated_calls: 3

prompt_injection:
  enabled: true
  deny_threshold: 0.85
  review_threshold: 0.65

dlp:
  enabled: true
  redact_emails: false
  redact_secrets: true
  redact_credit_cards: true

provenance_mapping:
  user: user
  system: system
  assistant: assistant
  tool: tool_output

tool_guard:
  workspace_root: .
  egress_allowlist: []

tools:
  lookup_order:
    description: Look up an order by ID in the customer database.
    action_type: read
    side_effect: internal_read
    risk_tier: low
    reversible: true
    requires_approval: false
    allowed_callers: [support_agent]

  send_email:
    description: Send an email to a customer or vendor.
    action_type: send_external
    side_effect: external_communication
    risk_tier: high
    reversible: false
    requires_approval: true
    allowed_callers: [support_agent]

  check_status_page:
    description: Fetch a vendor's public status page by URL to check for outages.
    action_type: read
    side_effect: external_communication
    risk_tier: medium
    reversible: true
    requires_approval: false
    allowed_callers: [support_agent]

workflows:
  customer_support:
    risk_tier: medium
    allowed_agents: [support_agent]
    allowed_tools: [lookup_order, send_email, check_status_page]
    egress_allowlist: [company.com]

rules: []
