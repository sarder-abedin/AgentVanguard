services:
  agentvanguard:
    build: .
    image: agentvanguard:latest
    ports:
      - "8080:8080"
    volumes:
      - ./agentvanguard.yaml:/app/agentvanguard.yaml:ro
      - ./logs:/app/logs
    environment:
      - AGENTVANGUARD_CONFIG=/app/agentvanguard.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
